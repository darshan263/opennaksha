        <script type="text/javascript">
            let PrintPDF = (doc) => {
                let objFra = document.createElement('iframe');     // Create an IFrame.
                objFra.style.visibility = 'hidden';                // Hide the frame.
                objFra.src = doc;                   // Set source.
                document.body.appendChild(objFra);  // Add the frame to the web page.
                objFra.contentWindow.focus();       // Set focus.
                objFra.contentWindow.print();       // Print it.
            }

            function setFormName(name) {
                //$("#lblMasterMainFormHeaderName").text(name);

            function showReportPDF(heading, pdfpath) {
                $("#lblpdfview").text(heading);
                $('#divMasterPDFView').html("<embed id='emPDFFile' src='" + pdfpath + "' type='application/pdf' width='100%' height='700px' />");
                $('#master-pdf-view-modal').modal('show');
            }

            function showReportchildPDF(heading, pdfpath) {
                $("#lblpdfviewchild").text(heading);
                $('#divMasterPDFViewchild').html("<embed id='emPDFFile' src='" + pdfpath + "' type='application/pdf' width='100%' height='700px' />");
                $('#master-pdf-view-modal-child').modal('show');
            }
