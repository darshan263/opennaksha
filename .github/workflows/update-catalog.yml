name: Update catalog

on:
  schedule:
    # Sunday 02:00 IST = Saturday 20:30 UTC
    - cron: "30 20 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/georef_points/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out previous catalog (catalog branch)
        uses: actions/checkout@v4
        with:
          ref: catalog
          path: catalog-branch

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        working-directory: pipeline
        run: |
          uv python install 3.12
          uv sync --locked --no-dev

      - name: Run pipeline
        working-directory: pipeline
        env:
          OPENNAKSHA_CONTACT: ${{ vars.OPENNAKSHA_CONTACT }}
        # Writes the run report to the job summary itself ($GITHUB_STEP_SUMMARY).
        run: uv run python -m opennaksha.run --previous ../catalog-branch --output output

      - name: Publish to catalog branch
        id: publish
        run: |
          report=pipeline/output/report.json
          if [ "$(jq -r .should_commit "$report")" != "true" ]; then
            echo "Nothing changed; not committing."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rsync -a --delete pipeline/output/catalog/ catalog-branch/catalog/
          mkdir -p catalog-branch/overlays
          if [ -d pipeline/output/overlays ]; then
            # Overlays accumulate: only newly built ones are in the output.
            rsync -a pipeline/output/overlays/ catalog-branch/overlays/
          fi
          touch catalog-branch/.nojekyll
          cd catalog-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$(jq -r .commit_message "../$report")"
          git push origin HEAD:catalog
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update issues for failing sources
        if: always() && hashFiles('pipeline/output/report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pipeline/output/report.json', 'utf8'));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const find = (sid) => open.find(i => !i.pull_request && i.title === `Source failing: ${sid}`);

            for (const [sid, count] of Object.entries(report.failing_sources)) {
              const err = report.failed_sources[sid] || 'unknown error';
              const body = `\`${sid}\` has failed **${count} runs in a row**.\n\n` +
                `Last error:\n\`\`\`\n${err}\n\`\`\`\nRun: ${runUrl}\n\n` +
                `The government site probably changed its layout. Its previous data is kept unchanged. ` +
                `Ask Claude Code: "Fix the scraper for ${sid}, see this issue", then re-run the workflow.`;
              const existing = find(sid);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: `Still failing (${count} runs). ${runUrl}\n\n\`\`\`\n${err}\n\`\`\``,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `Source failing: ${sid}`, body,
                });
              }
            }
            for (const sid of report.recovered_sources) {
              const existing = find(sid);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: `Recovered: \`${sid}\` scraped successfully again. ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  state: 'closed',
                });
              }
            }
